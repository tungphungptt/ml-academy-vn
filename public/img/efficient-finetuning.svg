<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">LoRA: hai nhánh, một phép cộng</title><desc id="desc">Bản LoRA cơ bản · giảm tham số huấn luyện, không bỏ chi phí toàn bộ hệ thống</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a6b4c4"/></marker></defs><rect width="640" height="360" rx="12" fill="#101923"/><g font-family="Segoe UI,Arial,sans-serif"><text x="320" y="30" text-anchor="middle" font-size="18" fill="#e2ebf4">LoRA: hai nhánh, một phép cộng</text><rect x="38" y="140" width="80" height="60" rx="8" fill="#192838" stroke="#83e8cb"/><text x="78" y="175" text-anchor="middle" font-size="14" fill="#83e8cb">x</text><rect x="214" y="75" width="180" height="60" rx="8" fill="#192838" stroke="#92baff"/><text x="304" y="110" text-anchor="middle" font-size="14" fill="#92baff">W₀ cố định</text><rect x="190" y="205" width="95" height="55" rx="8" fill="#192838" stroke="#83e8cb"/><text x="237.5" y="237.5" text-anchor="middle" font-size="14" fill="#83e8cb">A: r×dᵢₙ</text><rect x="330" y="205" width="110" height="55" rx="8" fill="#192838" stroke="#83e8cb"/><text x="385" y="237.5" text-anchor="middle" font-size="14" fill="#83e8cb">B: dₒᵤₜ×r</text><rect x="520" y="140" width="80" height="60" rx="8" fill="#192838" stroke="#83e8cb"/><text x="560" y="175" text-anchor="middle" font-size="14" fill="#83e8cb">y</text><line x1="118" y1="165" x2="212" y2="104" stroke="#a6b4c4" stroke-width="2" marker-end="url(#arrow)"/><line x1="118" y1="170" x2="188" y2="232" stroke="#a6b4c4" stroke-width="2" marker-end="url(#arrow)"/><line x1="285" y1="232" x2="328" y2="232" stroke="#a6b4c4" stroke-width="2" marker-end="url(#arrow)"/><line x1="395" y1="104" x2="520" y2="165" stroke="#a6b4c4" stroke-width="2" marker-end="url(#arrow)"/><line x1="440" y1="232" x2="520" y2="177" stroke="#a6b4c4" stroke-width="2" marker-end="url(#arrow)"/><text x="470" y="215" text-anchor="middle" font-size="14" fill="#edb886">α/r</text><text x="320" y="300" text-anchor="middle" font-size="19" fill="#83e8cb">y = W₀x + (α/r) B(Ax)</text><text x="320" y="337" text-anchor="middle" font-size="12" fill="#a6b4c4">Bản LoRA cơ bản · giảm tham số huấn luyện, không bỏ chi phí toàn bộ hệ thống</text></g></svg>