<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Next-token language modeling</title><desc id="desc">ID không phải thứ tự ngữ nghĩa · ví dụ mô tả pipeline, không train LLM</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a6b4c4"/></marker></defs><rect width="640" height="360" rx="12" fill="#101923"/><g font-family="Segoe UI,Arial,sans-serif"><text x="320" y="30" text-anchor="middle" font-size="18" fill="#e2ebf4">Next-token language modeling</text><rect x="20" y="105" width="115" height="65" rx="8" fill="#192838" stroke="#83e8cb"/><text x="77.5" y="142.5" text-anchor="middle" font-size="14" fill="#83e8cb">Token IDs</text><rect x="178" y="105" width="115" height="65" rx="8" fill="#192838" stroke="#83e8cb"/><text x="235.5" y="142.5" text-anchor="middle" font-size="14" fill="#83e8cb">Embedding</text><rect x="336" y="105" width="130" height="65" rx="8" fill="#192838" stroke="#83e8cb"/><text x="401" y="142.5" text-anchor="middle" font-size="14" fill="#83e8cb">Transformer</text><rect x="510" y="105" width="110" height="65" rx="8" fill="#192838" stroke="#83e8cb"/><text x="565" y="142.5" text-anchor="middle" font-size="14" fill="#83e8cb">Logits</text><line x1="136" y1="137" x2="177" y2="137" stroke="#a6b4c4" stroke-width="2" marker-end="url(#arrow)"/><line x1="294" y1="137" x2="335" y2="137" stroke="#a6b4c4" stroke-width="2" marker-end="url(#arrow)"/><line x1="467" y1="137" x2="509" y2="137" stroke="#a6b4c4" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="203" text-anchor="middle" font-size="13" fill="#edb886">Causal mask: không nhìn token tương lai</text><text x="320" y="252" text-anchor="middle" font-size="16" fill="#92baff">Input: BOS, A, B     →     Target: A, B, EOS</text><text x="320" y="337" text-anchor="middle" font-size="12" fill="#a6b4c4">ID không phải thứ tự ngữ nghĩa · ví dụ mô tả pi