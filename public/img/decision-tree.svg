<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" role="img" aria-label="Cây quyết định và độ giảm Gini"><title>Cây quyết định và độ giảm Gini</title><rect width="440" height="290" rx="12" fill="#f5f7fb"/><g style="font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:13px;fill:#1a1a1a"><text x="220.0" y="22.0" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="600">Cây quyết định: giảm Gini từ 0,5 xuống 0,25</text><line x1="220.0" y1="90.0" x2="120.0" y2="170.0" stroke="#8a93a6" stroke-width="1.2" /><line x1="220.0" y1="90.0" x2="320.0" y2="170.0" stroke="#8a93a6" stroke-width="1.2" /><rect x="140.0" y="50.0" width="160" height="44" rx="4" fill="#fff" stroke="#2f5bea" /><text x="220.0" y="69.0" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="600">Nút gốc: 3A, 3B</text><text x="220.0" y="86.0" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="normal">Gini = 0,5</text><rect x="40.0" y="170.0" width="160" height="44" rx="4" fill="#fff" stroke="#e8590c" /><text x="120.0" y="189.0" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="normal">Trái: 3A, 1B</text><text x="120.0" y="206.0" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="normal">Gini = 0,375</text><rect x="240.0" y="170.0" width="160" height="44" rx="4" fill="#fff" stroke="#2b8a3e" /><text x="320.0" y="189.0" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="normal">Phải: 2B</text><text x="320.0" y="206.0" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="normal">Gini = 0 (thuần)</text><text x="220.0" y="252.0" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="normal">Gini sau chia = (4/6)·0,375 + (2/6)·0 = 0,25</text></g></svg>