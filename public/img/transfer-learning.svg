<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" role="img" aria-label="Đóng băng thân và huấn luyện lớp mới"><title>Đóng băng thân và huấn luyện lớp mới</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#8a93a6"/></marker></defs><rect width="440" height="290" rx="12" fill="#f5f7fb"/><g style="font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:13px;fill:#1a1a1a"><text x="220.0" y="22.0" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="600">Transfer Learning: đóng băng thân, huấn luyện đầu ra mới</text><rect x="20.0" y="90.0" width="150" height="70" rx="4" fill="#e9ecef" stroke="#8a93a6" /><text x="95.0" y="121.5" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="normal">Thân mạng pretrained</text><text x="95.0" y="136.5" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="normal">(đóng băng)</text><line x1="170.0" y1="125.0" x2="215.0" y2="125.0" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#ar)"/><rect x="215.0" y="90.0" width="90" height="70" rx="4" fill="#fff" stroke="#8a93a6" /><text x="260.0" y="121.5" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="normal">đặc trưng</text><text x="260.0" y="136.5" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="normal">512 chiều</text><line x1="305.0" y1="125.0" x2="340.0" y2="125.0" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#ar)"/><rect x="340.0" y="90.0" width="90" height="70" rx="4" fill="#fff2e6" stroke="#e8590c" /><text x="385.0" y="114.0" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">Linear 512→10</text><text x="385.0" y="129.0" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">5130 tham số</text><text x="385.0" y="144.0" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">(huấn luyện)</text><text x="220.0" y="220.0" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="normal">chỉ lớp cam được cập nhật gradient</text></g></svg>