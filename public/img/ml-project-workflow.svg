<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" role="img" aria-label="Các bước của dự án ML"><title>Các bước của dự án ML</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#8a93a6"/></marker></defs><rect width="440" height="290" rx="12" fill="#f5f7fb"/><g style="font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:13px;fill:#1a1a1a"><text x="220.0" y="22.0" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="600">Quy trình một dự án ML</text><rect x="14.0" y="70.0" width="96" height="54" rx="4" fill="#fff" stroke="#2f5bea" /><text x="62.0" y="93.5" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">1. Bài toán</text><text x="62.0" y="108.5" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">và metric</text><line x1="110.0" y1="97.0" x2="122.0" y2="97.0" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#ar)"/><rect x="122.0" y="70.0" width="96" height="54" rx="4" fill="#fff" stroke="#2f5bea" /><text x="170.0" y="93.5" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">2. Dữ liệu</text><text x="170.0" y="108.5" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">khám phá</text><line x1="218.0" y1="97.0" x2="230.0" y2="97.0" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#ar)"/><rect x="230.0" y="70.0" width="96" height="54" rx="4" fill="#fff" stroke="#2f5bea" /><text x="278.0" y="93.5" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">3. Chia</text><text x="278.0" y="108.5" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">train/test</text><line x1="326.0" y1="97.0" x2="338.0" y2="97.0" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#ar)"/><rect x="338.0" y="70.0" width="96" height="54" rx="4" fill="#fff" stroke="#2f5bea" /><text x="386.0" y="101.0" text-anchor="middle" font-size="11" fill="#1a1a1a" font-