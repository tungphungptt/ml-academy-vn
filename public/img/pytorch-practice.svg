<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" role="img" aria-label="Shape qua các lớp của CNN"><title>Shape qua các lớp của CNN</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#8a93a6"/></marker></defs><rect width="440" height="290" rx="12" fill="#f5f7fb"/><g style="font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:13px;fill:#1a1a1a"><text x="220.0" y="22.0" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="600">Shape của CNN trên ảnh 28×28 (PyTorch: N,C,H,W)</text><rect x="8.0" y="100.0" width="76" height="52" rx="4" fill="#fff" stroke="#2f5bea" /><text x="46.0" y="122.5" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">Ảnh</text><text x="46.0" y="137.5" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">1×28×28</text><line x1="84.0" y1="126.0" x2="94.0" y2="126.0" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#ar)"/><rect x="94.0" y="100.0" width="76" height="52" rx="4" fill="#fff" stroke="#e8590c" /><text x="132.0" y="122.5" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">Conv 3×3</text><text x="132.0" y="137.5" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">8×28×28</text><line x1="170.0" y1="126.0" x2="180.0" y2="126.0" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#ar)"/><rect x="180.0" y="100.0" width="76" height="52" rx="4" fill="#fff" stroke="#2b8a3e" /><text x="218.0" y="122.5" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">MaxPool 2×2</text><text x="218.0" y="137.5" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">8×14×14</text><line x1="256.0" y1="126.0" x2="266.0" y2="126.0" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#ar)"/><rect x="266.0" y="100.0" width="76" height="52" rx="4" fill="#fff" stroke="#2f5bea" /><text x="304.0" y="122.5" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">Flatten</text><text x="304.0" y="137.5" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">1568</text><line x1="342.0" y1="126.0" x2="352.0" y2="126.0" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#ar)"/><rect x="352.0" y="100.0" width="76" height="52" rx="4" fill="#fff" stroke="#e8590c" /><text x="390.0" y="122.5" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">Linear</text><text x="390.0" y="137.5" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">10</text><text x="220.0" y="200.0" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="normal">Linear: 1568×10 + 10 = 15 690 tham số</text></g></svg>