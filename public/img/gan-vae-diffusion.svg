<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" role="img" aria-label="GAN, VAE và Diffusion"><title>GAN, VAE và Diffusion</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#8a93a6"/></marker></defs><rect width="440" height="290" rx="12" fill="#f5f7fb"/><g style="font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:13px;fill:#1a1a1a"><text x="220.0" y="22.0" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="600">Ba họ mô hình sinh</text><rect x="15.0" y="60.0" width="130" height="90" rx="4" fill="#fff" stroke="#2f5bea" /><text x="80.0" y="94.0" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">GAN</text><text x="80.0" y="109.0" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">G tạo mẫu giả</text><text x="80.0" y="124.0" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">D phân biệt thật/giả</text><rect x="155.0" y="60.0" width="130" height="90" rx="4" fill="#fff" stroke="#e8590c" /><text x="220.0" y="94.0" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">VAE</text><text x="220.0" y="109.0" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">encoder → z=μ+σε</text><text x="220.0" y="124.0" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">decoder + KL</text><rect x="295.0" y="60.0" width="130" height="90" rx="4" fill="#fff" stroke="#2b8a3e" /><text x="360.0" y="94.0" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">Diffusion</text><text x="360.0" y="109.0" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">thêm nhiễu dần</text><text x="360.0" y="124.0" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">rồi khử nhiễu</text><text x="80.0" y="180.0" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">D* = 0,5 khi p_g=p_data</text><text x="220.0" y="180.0" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">KL(μ=1,σ²=1)=0,5</text><text x="360.0" y="180.0" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">x_t=0,8·1+0,6·0,5=1,1</text></g></svg>