<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" role="img" aria-label="Autograd: f = a·b + c"><title>Autograd: f = a·b + c</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#8a93a6"/></marker></defs><rect width="440" height="290" rx="12" fill="#f5f7fb"/><g style="font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:13px;fill:#1a1a1a"><text x="220.0" y="22.0" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="600">Autograd: f = a·b + c</text><rect x="9.0" y="70.0" width="70" height="44" rx="4" fill="#fff" stroke="#2f5bea" /><text x="44.0" y="96.0" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">a=2, b=−3</text><rect x="97.0" y="70.0" width="70" height="44" rx="4" fill="#fff" stroke="#2f5bea" /><text x="132.0" y="88.5" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">a·b</text><text x="132.0" y="103.5" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">= −6</text><line x1="79.0" y1="92.0" x2="97.0" y2="92.0" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#ar)"/><rect x="185.0" y="70.0" width="70" height="44" rx="4" fill="#fff" stroke="#2f5bea" /><text x="220.0" y="96.0" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">+ c (c=10)</text><line x1="167.0" y1="92.0" x2="185.0" y2="92.0" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#ar)"/><rect x="273.0" y="70.0" width="70" height="44" rx="4" fill="#fff" stroke="#2f5bea" /><text x="308.0" y="96.0" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal">f = 4</text><line x1="255.0" y1="92.0" x2="273.0" y2="92.0" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#ar)"/><rect x="361.0" y="70.0" width="70" height="44" rx="4" fill="#fff" stroke="#2f5bea" /><text x="396.0" y="96.0" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="normal"></text><line x1="343.0" y1="92.0" x2="361.0" y2="92.0" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#ar)"/><text x="44.0" y="150.0" text-anchor="middle" font-size="11" fill="#e8590c" font-weight="normal">∂f/∂a=−3, ∂f/∂b=2</text><text x="132.0" y="150.0" text-anchor="middle" font-size="11" fill="#e8590c" font-weight="normal">∂f/∂(ab)=1</text><text x="220.0" y="150.0" text-anchor="middle" font-size="11" fill="#e8590c" font-weight="normal">∂f/∂c=1</text><text x="308.0" y="150.0" text-anchor="middle" font-size="11" fill="#e8590c" font-weight="normal">∂f/∂f=1</text><text x="396.0" y="150.0" text-anchor="middle" font-size="11" fill="#e8590c" font-weight="normal"></text><text x="220.0" y="200.0" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="normal">mũi tên xanh: tính tiến · số cam: gradient lan truyền ngược</text></g></svg>