<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" role="img" aria-label="RNN trải theo thời gian"><title>RNN trải theo thời gian</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#8a93a6"/></marker></defs><rect width="440" height="290" rx="12" fill="#f5f7fb"/><g style="font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:13px;fill:#1a1a1a"><text x="220.0" y="22.0" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="600">RNN: cùng trọng số, trạng thái ẩn truyền theo thời gian</text><rect x="110.0" y="90.0" width="90" height="56" rx="4" fill="#fff" stroke="#2f5bea" /><text x="155.0" y="114.5" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="normal">RNN</text><text x="155.0" y="129.5" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="normal">h1 = 0,7616</text><line x1="155.0" y1="200.0" x2="155.0" y2="148.0" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#ar)"/><text x="155.0" y="218.0" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="normal">x1 = 1</text><rect x="260.0" y="90.0" width="90" height="56" rx="4" fill="#fff" stroke="#2f5bea" /><text x="305.0" y="114.5" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="normal">RNN</text><text x="305.0" y="129.5" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="normal">h2 = −0,5506</text><line x1="305.0" y1="200.0" x2="305.0" y2="148.0" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#ar)"/><text x="305.0" y="218.0" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="normal">x2 = −1</text><rect x="10.0" y="100.0" width="60" height="36" rx="4" fill="#fff" stroke="#8a93a6" /><text x="40.0" y="122.0" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="normal">h₀ = 0</text><line x1="70.0" y1="118.0" x2="110.0" y2="118.0" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#ar)"/><line x1="200.0" y1="118.0" x2="260.0" y2="118.0" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#ar)"/><line x1="350.0" y1="118.0" x2="400.0" y2="118.0" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#ar)"/><text x="220.0" y="262.0" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="normal">hₜ = tanh(0,5·hₜ₋₁ + 1·xₜ)</text></g></svg>