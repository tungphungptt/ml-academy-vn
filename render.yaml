# Paid Starter compute and a persistent disk incur Render charges.
# Keep one instance: the SQLite database lives on this service's disk.
# Dockerfile CMD initializes empty databases only. Existing databases require
# separately reviewed migrations; startup never reseeds them.
# ADMIN_EMAIL/ADMIN_PASSWORD are optional and intentionally omitted: no admin
# account is provisioned by this Blueprint.
services:
  - type: web
    name: ml-academy-vn
    repo: https://github.com/tungphungptt/ml-academy-vn
    branch: main
    runtime: docker
    plan: starter
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: ml-academy-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: file:/data/app.db
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: LESSON_CONTENT_DIR
        value: /data/lesson-overrides
