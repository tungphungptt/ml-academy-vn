# Chạy: tạo file .env từ .env.example (đặt SESSION_SECRET dài >= 32 ký tự), rồi `docker compose up --build -d`
# Mặc định truy cập qua HTTP; nếu có HTTPS (reverse proxy) hãy đặt COOKIE_SECURE=true trong .env.
services:
  web:
    build: .
    ports: ["127.0.0.1:${PORT:-3000}:3000"]
    env_file: .env
    environment:
      DATABASE_URL: "${DOCKER_DATABASE_URL:-file:/data/app.db}"
      LESSON_CONTENT_DIR: "${DOCKER_LESSON_CONTENT_DIR:-/data/lesson-overrides}"
      PORT: "3000"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    volumes:
      - mldata:/data
      # SQLite and edited lessons share /data; bundled /app/content stays visible.
    restart: unless-stopped
volumes:
  mldata: {}
